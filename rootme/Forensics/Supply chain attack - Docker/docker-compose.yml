version: '3.5'

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "5000:80"
    # Source code
    volumes:
        - ./nginx/site.conf:/etc/nginx/conf.d/site.conf
        - ./nginx/site:/var/www/html
    restart: always
    # Hardening
    security_opt:
      - no-new-privileges:true

  jolokia:
    image: bodsch/docker-jolokia:1.6.0
    container_name: jolokia
    # Don't expose JMX
    #ports:
    #  - "8080:8080"
    restart: always

  phpmyadmin:
    image: bitnami/phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "3307:8080"
    # Security
    environment: 
      - ALLOW_EMPTY_PASSWORD=yes
    restart: always

  mysql:
    container_name: mysql
    build: .
    ports: 
      - 3306:3306
    restart: always
    command: bash -c "mysqld"

  hello-world:
    container_name: hello_world
    read_only: true
    image: hello-world:linux
    
  apache-php:
    container_name: apache2_php
    image: apachetwo/apache2_php:1.5
    ports: 
      - "4000:80"
    restart: always
    security_opt:
      - no-new-privileges:true

  tomcat:
    container_name: tomcat
    image: cloudesire/tomcat:8-jre8
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx2048m
      - TOMCAT_PASS="p4ssw0rddd:)"
    
  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    container_name: autoheal
    read_only: true
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock